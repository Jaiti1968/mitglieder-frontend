server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # HTML-Einstiegsdatei immer auf Aktualität prüfen
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React-Routen und statische Dateien
    location / {
        try_files $uri $uri/ /index.html;
    }
}